name: Docker Image CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: greg07/strava-garmin-name-sync:pr-${{ github.event.pull_request.number }}
