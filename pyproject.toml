[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strava-garmin-name-sync"
version = "1.0.0"
description = "Sync Strava activity names and descriptions from Garmin Connect"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "stravalib==2.4.0",
    "garminconnect==0.2.28",
    "schedule>=1.2.1",
    "python-dotenv>=1.0.0",
    "tzdata; platform_system != 'Darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pylint>=3",
]

[project.scripts]
strava-garmin-sync = "strava_garmin_sync_app.strava_garmin_sync:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
# Dataclasses (ActivityData, configs) legitimately carry many fields
max-attributes = 10
