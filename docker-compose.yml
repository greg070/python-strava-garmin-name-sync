services:
  strava-garmin-sync:
    build: .
    image: greg07/strava-garmin-name-sync:latest
    container_name: strava-garmin-sync
    restart: unless-stopped

    # Toute la configuration (identifiants inclus) vient du fichier .env
    # (copiez .env.example vers .env et remplissez vos valeurs)
    env_file:
      - .env

    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

    # Page de statut (http://localhost:8080)
    ports:
      - "8080:8080"

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

    # Sain si un sync a abouti récemment (endpoint /health de la page de statut)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 2m
