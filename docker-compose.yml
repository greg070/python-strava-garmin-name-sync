services:
  strava-garmin-sync:
    build: .
    image: greg07/strava-garmin-name-sync:latest
    container_name: strava-garmin-sync
    restart: unless-stopped

    # Toute la configuration (identifiants inclus) vient du fichier .env
    # (copiez .env.example vers .env et remplissez vos valeurs)
    env_file:
      - .env

    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

    # Sain si le fichier de log a été écrit dans les 2 dernières heures
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='logs/strava_garmin_sync.log'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<7200 else 1)"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 2m
